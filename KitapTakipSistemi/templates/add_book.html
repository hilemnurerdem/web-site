<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Kitap Ekle</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container">
        <h2>Kitap Ekle</h2>
        <form method="post">
            <input type="text" name="author_name" placeholder="Yazar Adı" required>
            <input type="text" name="book_name" placeholder="Kitap Adı" required>
            <input type="text" name="location" placeholder="Kitabın Bulunduğu Yer" required>

            <!-- 📌 Kategori Dropdown (Açılır Menü) -->
            <label for="kategori">Kitap Kategorisi:</label>
            <select id="kategori" name="kategori" required>
                {% for kategori in kategoriler %}
                    <option value="{{ kategori }}">{{ kategori }}</option>
                {% endfor %}
            </select>

            <button type="submit">Kaydet</button>
        </form action="{{ url_for('add_book') }}" method="post">
        <a href="{{ url_for('dashboard') }}">Geri Dön</a>
    </div>
</body>
</html>
