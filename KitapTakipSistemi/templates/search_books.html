<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Kitap Ara</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container">
        <h2>Kitap Ara</h2>
        <form method="post">
            <input type="text" name="search_query" placeholder="ID, Kitap Adı, Yazar veya Bulunduğu Yer" required>
            <button type="submit">Ara</button>
        </form>

        {% if books %}
            <h3>Arama Sonuçları:</h3>
            <table>
                <tr>
                    <th>ID</th>
                    <th>Kitap Adı</th>
                    <th>Yazar</th>
                    <th>Bulunduğu Yer</th>
                    <th>İşlemler</th>
                </tr>
                {% for book in books %}
                <tr>
                    <td>{{ book.id }}</td>
                    <td>{{ book.book_name }}</td>
                    <td>{{ book.author_name }}</td>
                    <td>{{ book.location }}</td>
                    <td>
                        <a href="{{ url_for('edit_book', book_id=book.id) }}">Düzenle</a> | 
                        <a href="{{ url_for('delete_book', book_id=book.id) }}" onclick="return confirm('Bu kitabı silmek istediğine emin misin?')">Sil</a>
                    </td>
                </tr>
                {% endfor %}
            </table>
        {% endif %}

        <a href="{{ url_for('dashboard') }}">Geri Dön</a>
    </div>
</body>
</html>
